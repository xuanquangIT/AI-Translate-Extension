name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Job names are required status checks in the main ruleset (.github/rulesets/main.json); rename both together.
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # syntax, extension validation, lint, format, unit + contract tests, agent-config drift, build
      - name: Verify
        run: npm run verify
      - name: Upload unpacked build
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: lingoflux-unpacked-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
