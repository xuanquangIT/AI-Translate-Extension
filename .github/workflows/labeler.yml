name: Label PR

# pull_request_target so labels can be applied to fork PRs. This workflow never checks out or runs PR code.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply area labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label by changed paths
        uses: actions/labeler@v5
        with:
          sync-labels: true
